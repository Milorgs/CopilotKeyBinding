name: Build 1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc -Os -s -Wall -Wextra -Werror -municode -mwindows -o dist/CopilotKey.exe CopilotKey.c -luser32
          cd dist
          sha256sum CopilotKey.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CopilotKey-windows-x64
          path: dist/*
          if-no-files-found: error
